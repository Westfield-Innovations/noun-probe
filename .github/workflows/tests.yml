name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # A PR merge commit was already tested as refs/pull/N/merge; direct pushes still run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          cd /tmp && noun-probe --help

  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/noun-probe/

    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read   # Required to checkout the repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import noun_probe; print(noun_probe.__version__)")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match noun_probe.__version__ '$PKG'. Retag the commit that sets the version."
            exit 1
          fi

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — no API token needed when trusted publishing is configured
        # Pending publisher set up at: https://pypi.org/manage/account/publishing/
